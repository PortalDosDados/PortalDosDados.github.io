<header class="bg-background/90 backdrop-blur-md text-primary sticky top-0 z-50 border-b border-outline-variant/30">

    <!-- Brand Logo -->
    <a class="flex items-center gap-2 group" href="#inicio">
      <div class="w-8 h-8 rounded-lg bg-surface-container-high border border-primary/40 flex items-center justify-center text-primary group-hover:cyan-glow transition-all">
        <span class="material-symbols-outlined text-[18px]">precision_manufacturing</span>
      </div>
      <div class="flex flex-col">
        <span class="font-metric-display text-sm text-primary tracking-widest uppercase font-bold">DN // DADOS.IND</span>
        <span class="font-label-caps text-[9px] text-on-surface-variant uppercase tracking-wider">PORTFÓLIO & ENGENHARIA</span>
      </div>
    </a>

    <!-- Desktop Navigation Links -->
    <nav aria-label="Navegação Principal" class="hidden lg:flex items-center lg:gap-6 xl:gap-8">
      <a class="nav-section-link whitespace-nowrap text-on-surface-variant font-code-md text-sm hover:text-primary transition-colors" href="#projetos">Projetos</a>
      <a class="nav-section-link whitespace-nowrap text-on-surface-variant font-code-md text-sm hover:text-primary transition-colors" href="#videos">Vídeos</a>
      <a class="nav-section-link whitespace-nowrap text-on-surface-variant font-code-md text-sm hover:text-primary transition-colors" href="#contato">Contato</a>
    </nav>

    <!-- Trailing Action Controls -->
    <div class="flex items-center gap-2.5">
      <!-- Botão para Currículo Detalhado -->
      <a class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded bg-surface-container-high border border-primary/40 text-primary hover:bg-primary-container hover:text-on-primary font-code-md text-xs font-semibold active:scale-[0.98] transition-all" href="curriculo.html">
        <span class="material-symbols-outlined text-[16px]">description</span>
        <span>Currículo</span>
      </a>

      <!-- Alternador de Tema -->
      <button aria-label="Alternar Modo de Tema" class="w-9 h-9 rounded bg-surface-container-high laser-border flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-[0.98] transition-all" id="themeToggleBtn">

      </button>

      <!-- CTA Contato Rápido -->
      <a class="hidden md:inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded bg-primary-container text-on-primary font-code-md text-xs font-semibold hover:opacity-95 active:scale-[0.98] transition-transform cyan-glow-subtle" href="#contato">
        <span class="material-symbols-outlined text-[16px]">chat</span>
        <span>Falar Comigo</span>
      </a>

      <!-- Botão Hamburger Mobile -->
      <button aria-controls="mobileMenu" aria-expanded="false" aria-label="Abrir menu de navegação" class="lg:hidden w-9 h-9 rounded bg-surface-container-high laser-border flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-[0.98] transition-all" id="mobileMenuBtn">
        <span class="material-symbols-outlined text-[20px]" id="mobileMenuIcon">menu</span>
      </button>
    </div>
  </div>

  <!-- Mobile Navigation Drawer -->
  <nav aria-label="Menu Mobile" class="hidden lg:hidden border-t border-outline-variant/30 bg-background/95 backdrop-blur-md px-4 py-4 space-y-1" id="mobileMenu">

    <div class="pt-2 border-t border-outline-variant/30">
      <a class="mobile-nav-link flex items-center gap-2 px-3 py-2.5 rounded font-code-md text-sm bg-primary-container text-on-primary font-bold" href="curriculo.html">
