<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada | Dione Nascimento</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/main.css" />
  </head>
  <body style="margin: 0" class="blueprint-grid">
    <main class="notfound">
      <div>
        <p class="notfound__code">404</p>
        <h1>Página não encontrada</h1>
        <p>O endereço que você acessou não existe ou foi movido.</p>
        <a class="btn btn--primary" href="/">Voltar ao portfólio</a>
      </div>
    </main>
  </body>
</html>
